spring.application.name=hmcs-pawning-service

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/hmcs_db
spring.datasource.username=hmcs_app
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configurations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use member_service schema by default
spring.jpa.properties.hibernate.default_schema=pawning_service

# Server port
server.port=8085



hmcs.app.jwtExpirationMs=86400000
spring.jpa.properties.hibernate.tenant_identifier_resolver=com.hmcs.pawning.multitenancy.TenantIdentifierResolver
