spring:
  codec:
    max-in-memory-size: 50MB
  application:
    name: hmcs-api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
      routes:
        - id: member-auth-service
          uri: http://hmcs-member-auth-service:8081
          predicates:
            - Path=/api/v1/auth/**, /api/v1/members/**

        - id: savings-service
          uri: http://hmcs-savings-service:8082
          predicates:
            - Path=/api/v1/accounts/**, /api/v1/savings/**, /api/v1/transactions/**, /api/v1/fixed-deposit-types/**, /api/v1/fixed-deposits/**

        - id: loan-service
          uri: http://hmcs-loan-service:8084
          predicates:
            - Path=/api/v1/loans/**

        - id: pawning-service
          uri: http://hmcs-pawning-service:8085
          predicates:
            - Path=/api/v1/pawning/**

        - id: reporting-service
          uri: http://hmcs-reporting-service:8087
          predicates:
            - Path=/api/v1/reports/**, /api/v1/admin/**

server:
  port: 8080
