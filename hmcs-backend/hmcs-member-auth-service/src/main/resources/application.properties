spring.application.name=hmcs-member-auth-service

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/hmcs_db
spring.datasource.username=hmcs_app
spring.datasource.password=hmcs_secure_pass_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configurations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Validate schema against entities, but don't drop/create since we have a manual SQL script
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use auth_service schema by default
spring.jpa.properties.hibernate.default_schema=auth_service

# Server port
server.port=8081

# Increase max payload size for base64 images
server.tomcat.max-http-form-post-size=50MB
