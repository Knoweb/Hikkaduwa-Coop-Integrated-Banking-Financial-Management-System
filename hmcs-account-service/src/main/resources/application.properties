spring.application.name=hmcs-account-service

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/hmcs_db
spring.datasource.username=hmcs_app
spring.datasource.password=hmcs_secure_pass_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate configurations
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use member_service schema by default
spring.jpa.properties.hibernate.default_schema=member_service

# Server port
server.port=8082


hmcs.app.jwtExpirationMs=86400000
