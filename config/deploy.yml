# SL CERT COMPLIANT DEPLOYMENT CONFIGURATION (Kamal)
# This configuration deploys the HMCS application to the Primary and DR droplets.

service: hmcs-bank
image: ghcr.io/${GITHUB_REPOSITORY}/hmcs-api-gateway

# Primary (Singapore) and DR (Bangalore) IP addresses
servers:
  web:
    hosts:
      - 143.198.211.244 # Singapore (Primary)
      - 168.144.216.11  # Bangalore (DR)
    labels:
      traefik.http.routers.hmcs.rule: Host(`api.hikkaduwabank.com`)
      traefik.http.routers.hmcs.entrypoints: websecure
      traefik.http.routers.hmcs.tls.certresolver: letsencrypt

# Registry configuration for GitHub Container Registry
registry:
  server: ghcr.io
  username: ${GITHUB_ACTOR}
  password:
    - KAMAL_REGISTRY_PASSWORD

# Environment variables mapping (Secured via GitHub Secrets)
env:
  clear:
    SPRING_DATASOURCE_URL: jdbc:postgresql://10.104.0.21:5432/hmcs_db
    TZ: Asia/Colombo
  secret:
    - DB_PASSWORD

# Traefik configuration (Reverse Proxy & Zero Downtime)
traefik:
  options:
    publish:
      - "80:80"
      - "443:443"
    volume:
      - "/letsencrypt/acme.json:/letsencrypt/acme.json"

# Note: In a microservices architecture, you will have multiple deploy.yml files 
# (e.g., deploy-auth.yml, deploy-loan.yml) to deploy each microservice independently 
# with zero downtime.
