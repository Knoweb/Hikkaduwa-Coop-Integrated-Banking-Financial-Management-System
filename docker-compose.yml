version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: hmcs-postgres
    env_file:
    - ./hmcs-backend/.env
    environment:
      POSTGRES_USER: hmcs_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: hmcs_db
    volumes:
    - ./postgres-data:/var/lib/postgresql/data
    - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
    - hmcs_dmz
  hmcs-api-gateway:
    build: ./hmcs-backend/hmcs-api-gateway
    container_name: hmcs-api-gateway
    ports:
    - 8080:8080
    depends_on:
    - postgres
    env_file:
    - ./hmcs-backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
    - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped
    networks:
    - hmcs_dmz
  hmcs-member-auth-service:
    build: ./hmcs-backend/hmcs-member-auth-service
    container_name: hmcs-member-auth-service
    dns:
    - 8.8.8.8
    - 8.8.4.4
    depends_on:
    - postgres
    env_file:
    - ./hmcs-backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
    - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped
    networks:
    - hmcs_dmz
  hmcs-audit-service:
    build:
      context: ./hmcs-backend/hmcs-audit-service
      dockerfile: Dockerfile
    container_name: hmcs-audit-service
    depends_on:
    - postgres
    env_file:
    - ./hmcs-backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
    - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped
    networks:
    - hmcs_dmz
  hmcs-savings-service:
    build: ./hmcs-backend/hmcs-savings-service
    container_name: hmcs-savings-service
    depends_on:
    - postgres
    env_file:
    - ./hmcs-backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
    - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped
    networks:
    - hmcs_dmz
  hmcs-loan-service:
    build: ./hmcs-backend/hmcs-loan-service
    container_name: hmcs-loan-service
    depends_on:
    - postgres
    env_file:
    - ./hmcs-backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
      SAVINGS_SERVICE_HOST: hmcs-savings-service
    volumes:
    - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped
    networks:
    - hmcs_dmz
  hmcs-pawning-service:
    build: ./hmcs-backend/hmcs-pawning-service
    container_name: hmcs-pawning-service
    depends_on:
    - postgres
    env_file:
    - ./hmcs-backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
    - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped
    networks:
    - hmcs_dmz
  hmcs-reporting-service:
    build: ./hmcs-backend/hmcs-reporting-service
    container_name: hmcs-reporting-service
    depends_on:
    - postgres
    env_file:
    - ./hmcs-backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
    - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped
    networks:
    - hmcs_dmz
  adminer:
    image: adminer
    container_name: hmcs-db-viewer
    depends_on:
    - postgres
    restart: unless-stopped
    networks:
    - hmcs_dmz
  hmcs-frontend:
    build: ./hmcs-frontend
    container_name: hmcs-frontend
    ports:
    - 80:5173
    depends_on:
    - hmcs-api-gateway
    environment:
    - VITE_PROXY_TARGET=http://hmcs-api-gateway:8080
    restart: unless-stopped
    networks:
    - hmcs_dmz
  loki:
    image: grafana/loki:2.9.2
    container_name: hmcs-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
    - ./logging-config/loki-config.yaml:/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
    - hmcs_dmz
  promtail:
    image: grafana/promtail:2.9.2
    container_name: hmcs-promtail
    volumes:
    - ./hmcs-logs:/var/logs/hmcs
    - ./logging-config/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
    - loki
    restart: unless-stopped
    networks:
    - hmcs_dmz
  grafana:
    image: grafana/grafana:10.2.2
    container_name: hmcs-grafana
    depends_on:
    - loki
    restart: unless-stopped
    networks:
    - hmcs_dmz
networks:
  hmcs_dmz:
    driver: bridge
    internal: false
