version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hmcs-postgres
    environment:
      POSTGRES_USER: hmcs_app
      POSTGRES_PASSWORD: hmcs_secure_pass_2026
      POSTGRES_DB: hmcs_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - "./init_db.sql:/docker-entrypoint-initdb.d/init.sql"
    restart: unless-stopped

  hmcs-api-gateway:
    build: ./hmcs-backend/hmcs-api-gateway
    container_name: hmcs-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
      - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped

  hmcs-member-auth-service:
    build: ./hmcs-backend/hmcs-member-auth-service
    container_name: hmcs-member-auth-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
      - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped

  hmcs-audit-service:
    build:
      context: ./hmcs-backend/hmcs-audit-service
      dockerfile: Dockerfile
    container_name: hmcs-audit-service
    ports:
      - "8089:8089"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
      - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped

  hmcs-savings-service:
    build: ./hmcs-backend/hmcs-savings-service
    container_name: hmcs-savings-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
      - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped

  hmcs-loan-service:
    build: ./hmcs-backend/hmcs-loan-service
    container_name: hmcs-loan-service
    ports:
      - "8084:8084"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
      SAVINGS_SERVICE_HOST: hmcs-savings-service
    volumes:
      - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped

  hmcs-pawning-service:
    build: ./hmcs-backend/hmcs-pawning-service
    container_name: hmcs-pawning-service
    ports:
      - "8085:8085"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
      - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped

  hmcs-reporting-service:
    build: ./hmcs-backend/hmcs-reporting-service
    container_name: hmcs-reporting-service
    ports:
      - "8087:8087"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hmcs_db
      TZ: Asia/Colombo
    volumes:
      - ./hmcs-logs:/var/logs/hmcs
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: hmcs-db-viewer
    ports:
      - "8088:8080"
    depends_on:
      - postgres
    restart: unless-stopped

  hmcs-frontend:
    build: ./hmcs-frontend
    container_name: hmcs-frontend
    ports:
      - "5173:5173"
    depends_on:
      - hmcs-api-gateway
    volumes:
      - ./hmcs-frontend/src:/app/src
      - ./hmcs-frontend/public:/app/public
      - ./hmcs-frontend/index.html:/app/index.html
      - ./hmcs-frontend/vite.config.ts:/app/vite.config.ts
    environment:
      - VITE_PROXY_TARGET=http://hmcs-api-gateway:8080
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.2
    container_name: hmcs-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./logging-config/loki-config.yaml:/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.2
    container_name: hmcs-promtail
    volumes:
      - ./hmcs-logs:/var/logs/hmcs
      - ./logging-config/promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    container_name: hmcs-grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
    restart: unless-stopped
