server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: hmcs_microservices
    static_configs:
      - targets:
          - localhost
        labels:
          job: hmcs_logs
          __path__: /var/logs/hmcs/*.log

    # Extract the application name from the filename to use as a label
    pipeline_stages:
      - regex:
          expression: "^/var/logs/hmcs/(?P<app>[a-zA-Z0-9-]+)\\.log$"
          source: filename
      - labels:
          app:
